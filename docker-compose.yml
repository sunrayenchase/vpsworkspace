services:

  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    image: vps-caddy:latest
    pull_policy: build
    container_name: caddy
    restart: unless-stopped
    user: "${USER_ID}:${USER_ID}"
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DUCKDNSDOMAIN}
      DUCKDNS_TOKEN: ${DUCKDNSTOKEN}
      TZ: ${TZ}
      XUI_PANEL_PORT: ${XUI_PANEL_PORT}
      XUI_REVERSE_PROXY_PORT: ${XUI_REVERSE_PROXY_PORT}
      XUI_INBOUND_PORT: ${XUI_INBOUND_PORT}
      XUI_WEB: ${XUI_WEB}
      SYNC_WEB: ${SYNC_WEB}
      SYNC_PANEL_PORT: ${SYNC_PANEL_PORT}
      SYNC_SECRET_PATH: ${SYNC_SECRET_PATH}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - ./caddy/data:/data
      - ./caddy/config:/config
    networks:
      - server_network
    depends_on:
      3x-ui:
        condition: service_healthy

  3x-ui:
    image: ghcr.io/mhsanaei/3x-ui:latest
    container_name: 3x-ui
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      XRAY_VMESS_AEAD_FORCED: "false"
      XUI_ENABLE_FAIL2BAN: "true"
      XUI_PORT: ${XUI_PANEL_PORT}
      TZ: ${TZ}
    volumes:
      - ./3x-ui/db:/etc/x-ui
      - ./3x-ui/cert:/root/cert
    networks:
      server_network:
        ipv4_address: ${XUI4}
    healthcheck:
      test: ["CMD", "pidof", "x-ui"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  backup:
    image: alpine:latest
    container_name: backup
    restart: always
    volumes:
      - .:/workspace
    networks:
      - server_network
    environment:
      - TZ=${TZ}
      - PUID=${USER_ID}
      - PGID=${USER_ID}
      - BACKUP_FOLDER_NAME=${BACKUP_FOLDER_NAME}
      - EXCLUDES=${EXCLUDES_FOLDERS}
      - COPIES_TO_KEEP=${COPIES_TO_KEEP}
      - CRON_SCHEDULE=${CRON_SCHEDULE}
    entrypoint: >
      /bin/sh -c "
      apk add --no-cache bash tar tzdata;
      echo 'Setting up periodic backup...';
      echo \"$$CRON_SCHEDULE /bin/bash /workspace/bscript/backup.sh >> /workspace/$$BACKUP_FOLDER_NAME/backup.log 2>&1\" > /etc/cron.d/backup-cron;
      chmod 0644 /etc/cron.d/backup-cron;
      crontab /etc/cron.d/backup-cron;
      echo 'Cron service started. Watching schedule...';
      crond -f -l 2
      "

  syncthing:
    image: syncthing/syncthing:latest
    container_name: syncthing
    restart: always
    user: "${USER_ID}:${USER_ID}"
    environment:
      # Instructs Syncthing to bind the Web UI to all interfaces (0.0.0.0)
      - STGUIADDRESS=0.0.0.0:${SYNC_PANEL_PORT}
      - TZ=${TZ}
    volumes:
      - ./syncthing:/var/syncthing/config
      - ./${BACKUP_FOLDER_NAME}:/var/syncthing/sync
    networks:
      - server_network
    ports:
      # Syncthing protocol listening port for cluster sync communication
      - "22000:22000/tcp"
      - "22000:22000/udp"

  fail2ban:
    image: crazymax/fail2ban:latest
    container_name: fail2ban
    restart: unless-stopped
    network_mode: host
    environment:
      TZ: ${TZ}
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./fail2ban/jail.d/jail.local:/data/jail.d/jail.local:ro
      - ./fail2ban/filter.d/sshd.conf:/data/filter.d/sshd.conf:ro
      - /var/log/auth.log:/var/log/auth.log:ro

networks:
  server_network:
    name: server_network
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        - subnet: ${SUBNET4}
        - subnet: ${SUBNET6}

